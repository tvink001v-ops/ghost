<script>
    const FORM_URL = "https://google.com";
    const FIELDS = ["entry.1746401037", "entry.1508215891", "entry.724816159"];

    // Ваш ID таблицы
    const SPREADSHEET_ID = "1MkTPP2d3ZNSiT6Kw4KrMeyKPDVAxstK97RzTroa9K4k"; 
    // Запрос через Sheets API v4 Sheets values (не требует ключей, если таблица опубликована в веб)
    const DATA_URL = `https://google.com{SPREADSHEET_ID}/v2/sheets/sheets_values`;

    function switchTab(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if (event && event.target) event.target.classList.add('active');
        if(pageId === 'feed-page') loadTasks();
    }

    // Альтернативный сверхстабильный разбор опубликованной таблицы
    function loadTasks() {
        const list = document.getElementById('taskList');
        
        // Используем универсальный URL для чтения опубликованных строк в формате JSON
        fetch(`https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Ответы на форму (1)`)
        .then(res => res.text())
        .then(txt => {
            // Очищаем обертку Google-функции google.visualization.Query.setResponse(...)
            const startPos = txt.indexOf('{');
            const endPos = txt.lastIndexOf('}') + 1;
            const jsonString = txt.substring(startPos, endPos);
            
            const data = JSON.parse(jsonString);
            const rows = data.table.rows;
            
            // Если строк нет или в них только заголовки
            if (!rows || rows.length <= 1) {
                list.innerHTML = "<p style='text-align:center; color:var(--muted);'>Нет активных контрактов.</p>";
                return;
            }
            
            list.innerHTML = "";
            
            // Вывод от новых к старым (пропускаем строку 0, так как это шапка таблицы)
            for (let i = rows.length - 1; i >= 1; i--) {
                const cells = rows[i].c;
                if (!cells) continue;

                // Извлекаем значения ячеек с проверкой на пустые поля
                const time = cells[0] && cells[0].f ? cells[0].f : "Недавно";
                const title = cells[1] && cells[1].v ? cells[1].v : "Без названия";
                const desc = cells[2] && cells[2].v ? cells[2].v : "Описание отсутствует";
                const reward = cells[3] && cells[3].v ? cells[3].v : "Не указана";

                list.innerHTML += `
                    <div class="task-card">
                        <h3>${escapeHtml(title)}</h3>
                        <p>${escapeHtml(desc)}</p>
                        <div class="task-meta">
                            <span class="reward-badge">💰 Награда: ${escapeHtml(reward)}</span>
                            <span class="time-stamp">${time.split(' ')[0]}</span>
                        </div>
                    </div>`;
            }
        })
        .catch((err) => {
            console.error(err);
            list.innerHTML = "<p style='text-align:center; color:var(--muted);'>Ошибка загрузки шифрованной ленты. Перепроверьте публикацию.</p>";
        });
    }

    document.getElementById('ghostForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const box = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "ШИФРОВАНИЕ...";

        const data = new URLSearchParams();
        ["title", "desc", "reward"].forEach((id, i) => {
            data.append(FIELDS[i], document.getElementById(id).value);
        });

        fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: data })
        .then(() => {
            box.className = "status ok";
            box.innerText = "Контракт опубликован.";
            box.style.display = "block";
            e.target.reset();
            setTimeout(() => { switchTab('feed-page'); box.style.display = "none"; }, 1500);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Опубликовать в сети";
        });
    });

    function escapeHtml(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Первичный запуск при открытии сайта
    loadTasks();
</script>
