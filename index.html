<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Доска заданий</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 10px 30px;
            color: #e6edf3;
            touch-action: manipulation;
        }
        .app-wrapper {
            max-width: 480px;
            width: 100%;
            background: #161b22;
            border-radius: 28px 28px 24px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 16px 14px 28px;
            border: 1px solid #30363d;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 8px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            background: #238636;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(35, 134, 54, 0.3);
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
            color: #f0f6fc;
        }
        .logo-text span { color: #238636; }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0d1117;
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            border: 1px solid #30363d;
            font-size: 0.8rem;
            color: #e6edf3;
            cursor: pointer;
        }
        .user-badge i { color: #238636; font-size: 0.9rem; }
        .user-badge:hover { background: #1c2128; }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .status-dot.online { background: #238636; }
        .status-dot.offline { background: #da3633; }

        /* ===== РЕГИСТРАЦИЯ ===== */
        .register-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .register-overlay.hidden {
            display: none;
        }
        .register-box {
            background: #161b22;
            border-radius: 32px;
            padding: 32px 28px 36px;
            max-width: 380px;
            width: 100%;
            border: 1px solid #30363d;
            box-shadow: 0 24px 48px rgba(0,0,0,0.6);
        }
        .register-box .logo-area {
            justify-content: center;
            margin-bottom: 24px;
        }
        .register-box .logo-area .logo-icon {
            width: 56px;
            height: 56px;
            font-size: 28px;
        }
        .register-box .logo-area .logo-text {
            font-size: 1.6rem;
        }
        .register-title {
            text-align: center;
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .register-input-group {
            margin-bottom: 16px;
        }
        .register-input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #8b949e;
            margin-bottom: 6px;
        }
        .register-input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 1.1rem;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }
        .register-input-group input:focus {
            border-color: #238636;
            box-shadow: 0 0 0 3px rgba(35, 134, 54, 0.15);
        }
        .register-input-group input::placeholder {
            color: #8b949e;
        }
        .register-btn {
            background: #238636;
            border: none;
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }
        .register-btn:active { transform: scale(0.96); }
        .register-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
        .register-hint {
            text-align: center;
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 12px;
        }
        .register-hint i { color: #238636; margin-right: 4px; }

        /* Основной интерфейс */
        .main-content {
            display: block;
        }
        .main-content.hidden {
            display: none;
        }

        .create-section {
            background: #0d1117;
            border-radius: 24px;
            padding: 16px 16px 20px;
            margin-bottom: 24px;
            border: 1px solid #30363d;
        }
        .create-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .create-title i { color: #238636; font-size: 1.2rem; }
        .create-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .create-input-group {
            width: 100%;
        }
        .create-input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .create-input-group input,
        .create-input-group textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 1rem;
            transition: 0.2s;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .create-input-group textarea {
            resize: vertical;
            min-height: 56px;
            font-family: inherit;
            border-radius: 16px;
        }
        .create-input-group input:focus,
        .create-input-group textarea:focus {
            border-color: #238636;
            box-shadow: 0 0 0 3px rgba(35, 134, 54, 0.15);
        }
        .create-input-group input::placeholder,
        .create-input-group textarea::placeholder {
            color: #8b949e;
        }
        .create-btn {
            background: #238636;
            border: none;
            color: white;
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.25);
            width: 100%;
            touch-action: manipulation;
            user-select: none;
        }
        .create-btn:active { transform: scale(0.96); }
        .create-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
        .remote-badge {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #8b949e;
            background: #0d1117;
            padding: 4px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #30363d;
        }
        .remote-badge i { margin-right: 5px; color: #238636; }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 14px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .list-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-header h2 i { color: #238636; font-size: 1.1rem; }
        .list-header span {
            background: #0d1117;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #8b949e;
            border: 1px solid #30363d;
        }
        .tasks-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .task-card {
            background: #0d1117;
            border-radius: 20px;
            padding: 16px 16px 18px;
            border: 1px solid #30363d;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
        }
        .task-card:active { transform: scale(0.99); }
        .task-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #f0f6fc;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .task-desc {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 10px;
            line-height: 1.4;
            flex: 1;
            word-break: break-word;
        }
        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            border-top: 1px solid #30363d;
            padding-top: 12px;
        }
        .task-author {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: #8b949e;
        }
        .task-author i { font-size: 0.9rem; color: #238636; }
        .task-status {
            font-size: 0.65rem;
            background: #238636;
            color: #f0f6fc;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            white-space: nowrap;
        }
        .task-status.taken {
            background: #d29922;
        }
        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn-action {
            border: none;
            padding: 10px 18px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #21262d;
            color: #c9d1d9;
            touch-action: manipulation;
            user-select: none;
            flex: 1 1 auto;
            min-width: 80px;
            justify-content: center;
        }
        .btn-action:active { transform: scale(0.95); }
        .btn-action:disabled {
            opacity: 0.4;
            transform: none;
            cursor: not-allowed;
        }
        .btn-action.take {
            background: #238636;
            color: white;
        }
        .btn-action.take:active { background: #2ea043; }
        .btn-action.done {
            background: #1f6feb;
            color: white;
        }
        .btn-action.done:active { background: #388bfd; }
        .btn-action.delete {
            background: #da3633;
            color: white;
        }
        .btn-action.delete:active { background: #f85149; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #0d1117;
            border-radius: 24px;
            color: #8b949e;
            border: 1px dashed #30363d;
        }
        .empty-state i {
            font-size: 2.5rem;
            opacity: 0.4;
            margin-bottom: 12px;
            display: block;
            color: #238636;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #8b949e;
            text-align: center;
            border-top: 1px solid #30363d;
            padding-top: 16px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer-note i { margin-right: 3px; color: #238636; }
        .loading-shimmer {
            color: #8b949e;
            text-align: center;
            padding: 20px;
        }
        .loading-shimmer i {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #238636;
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #da3633; }

        @media (max-width: 400px) {
            .app-wrapper { padding: 12px 10px 20px; }
            .task-actions { gap: 6px; }
            .btn-action { padding: 8px 14px; font-size: 0.75rem; min-width: 60px; }
            .register-box { padding: 24px 20px 28px; }
        }
        @media (hover: none) {
            .task-card:hover { transform: none; }
            .btn-action:hover { background: inherit; }
            .btn-action.take:hover { background: #238636; }
            .btn-action.done:hover { background: #1f6feb; }
            .btn-action.delete:hover { background: #da3633; }
        }
    </style>
</head>
<body>

<!-- ===== РЕГИСТРАЦИЯ ===== -->
<div class="register-overlay" id="registerOverlay">
    <div class="register-box">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tasks"></i></div>
            <div class="logo-text">Доска <span>заданий</span></div>
        </div>
        <div class="register-title">👋 Добро пожаловать!</div>
        <div class="register-input-group">
            <label for="nameInput"><i class="fas fa-user"></i> Ваше имя</label>
            <input type="text" id="nameInput" placeholder="Например: Алексей" maxlength="30" autofocus>
        </div>
        <button class="register-btn" id="registerBtn"><i class="fas fa-arrow-right"></i> Войти</button>
        <div class="register-hint">
            <i class="fas fa-info-circle"></i> Имя будет видно другим пользователям
        </div>
    </div>
</div>

<!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== -->
<div class="app-wrapper main-content hidden" id="mainContent">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tasks"></i></div>
            <div class="logo-text">Доска <span>заданий</span></div>
        </div>
        <div class="user-badge" id="userBadge">
            <span class="status-dot" id="statusDot"></span>
            <i class="fas fa-user"></i>
            <span id="userName">Вы</span>
        </div>
    </div>

    <div class="create-section">
        <div class="create-title">
            <i class="fas fa-plus-circle"></i> Создать задание
        </div>
        <div class="create-grid">
            <div class="create-input-group">
                <label for="taskTitleInput"><i class="far fa-file-alt"></i> Название *</label>
                <input type="text" id="taskTitleInput" placeholder="Например: Помогите с физикой">
            </div>
            <div class="create-input-group">
                <label for="taskDescInput"><i class="fas fa-align-left"></i> Описание</label>
                <textarea id="taskDescInput" rows="1" placeholder="Что нужно сделать..."></textarea>
            </div>
            <button class="create-btn" id="addTaskBtn"><i class="fas fa-plus"></i> Добавить</button>
        </div>
        <div class="remote-badge">
            <i class="fas fa-globe-americas"></i> Облачная синхронизация
        </div>
    </div>

    <div class="list-header">
        <h2><i class="fas fa-list-ul"></i>Задания</h2>
        <span><i class="fas fa-tasks"></i> <span id="taskCount">0</span></span>
    </div>

    <div class="tasks-grid" id="tasksContainer">
        <div class="loading-shimmer">
            <i class="fas fa-spinner"></i> Загрузка...
        </div>
    </div>

    <div class="footer-note">
        <span><i class="fas fa-check-circle"></i> Создавай</span>
        <span><i class="fas fa-handshake"></i> Помогай</span>
        <span><i class="fas fa-edit"></i> Отмечай</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        // ===== ВАШИ ДАННЫЕ ИЗ SUPABASE =====
        const SUPABASE_URL = 'https://bzntjichpncyswskbetz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bnRqaWNocG5jeXN3c2tiZXR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjcxMzAsImV4cCI6MjEwMDg0MzEzMH0.cs9fotOCspkvmRgvksTYToaF9vhuo6eqYqL_XPjIdgI';
        // ===================================

        let supabase = null;
        let isConfigured = false;
        let currentUser = '';
        const tableName = 'tasks';

        // === Управление регистрацией ===
        const registerOverlay = document.getElementById('registerOverlay');
        const mainContent = document.getElementById('mainContent');
        const nameInput = document.getElementById('nameInput');
        const registerBtn = document.getElementById('registerBtn');
        const userNameDisplay = document.getElementById('userName');

        // Проверяем, есть ли сохранённое имя
        const savedName = localStorage.getItem('task_user_name');
        if (savedName) {
            currentUser = savedName;
            registerOverlay.classList.add('hidden');
            mainContent.classList.remove('hidden');
            userNameDisplay.textContent = currentUser;
            initApp();
        }

        // Регистрация
        registerBtn.addEventListener('click', function() {
            const name = nameInput.value.trim();
            if (name.length < 2) {
                showToast('⚠️ Введите имя (минимум 2 символа)', true);
                nameInput.focus();
                return;
            }
            if (name.length > 30) {
                showToast('⚠️ Имя не должно превышать 30 символов', true);
                return;
            }
            currentUser = name;
            localStorage.setItem('task_user_name', name);
            registerOverlay.classList.add('hidden');
            mainContent.classList.remove('hidden');
            userNameDisplay.textContent = currentUser;
            showToast(`👋 Добро пожаловать, ${currentUser}!`);
            initApp();
        });

        // Enter на поле имени
        nameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                registerBtn.click();
            }
        });

        // Фокус на поле при загрузке
        if (!savedName) {
            setTimeout(() => nameInput.focus(), 300);
        }

        // === ОСНОВНОЙ КОД ПРИЛОЖЕНИЯ ===
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.offsetHeight;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function initApp() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                isConfigured = true;
                document.getElementById('statusDot').className = 'status-dot online';
                loadTasks();
            } catch (e) {
                console.error('Ошибка инициализации:', e);
                document.getElementById('statusDot').className = 'status-dot offline';
                showToast('❌ Ошибка подключения', true);
                loadTasks();
            }

            // Обработчики
            document.getElementById('addTaskBtn').addEventListener('click', addTask);
            document.getElementById('taskTitleInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addTask();
                }
            });

            // Клик по имени пользователя — смена имени
            document.getElementById('userBadge').addEventListener('click', function() {
                const newName = prompt('Введите новое имя:', currentUser);
                if (newName && newName.trim().length >= 2) {
                    currentUser = newName.trim();
                    localStorage.setItem('task_user_name', currentUser);
                    userNameDisplay.textContent = currentUser;
                    showToast(`✅ Имя изменено на ${currentUser}`);
                    renderTasks(); // обновляем список
                } else if (newName !== null) {
                    showToast('⚠️ Имя должно быть не менее 2 символов', true);
                }
            });

            document.addEventListener('touchstart', function(e) {
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    document.activeElement?.blur();
                }
            }, { passive: true });
        }

        const STORAGE_KEY = 'mobile_board_tasks_cloud';
        let tasks = [];

        async function loadTasks() {
            const container = document.getElementById('tasksContainer');
            
            if (!isConfigured) {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        tasks = JSON.parse(stored);
                    } catch (e) {}
                }
                renderTasks();
                return;
            }

            try {
                container.innerHTML = `<div class="loading-shimmer"><i class="fas fa-spinner"></i> Загрузка...</div>`;
                
                const { data, error } = await supabase
                    .from(tableName)
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Ошибка загрузки:', error);
                    if (error.code === '42P01') {
                        showToast('❌ Таблица не найдена! Создайте в Supabase', true);
                    } else if (error.code === '42501') {
                        showToast('❌ Нет прав! Создайте политики в Supabase', true);
                    } else {
                        showToast('❌ Ошибка загрузки: ' + error.message, true);
                    }
                    isConfigured = false;
                    document.getElementById('statusDot').className = 'status-dot offline';
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        try {
                            tasks = JSON.parse(stored);
                        } catch (e) {}
                    }
                    renderTasks();
                    return;
                }

                tasks = data || [];
                renderTasks();
                if (tasks.length > 0) {
                    showToast(`📋 Загружено ${tasks.length} заданий`);
                }
            } catch (e) {
                console.error('Ошибка:', e);
                isConfigured = false;
                document.getElementById('statusDot').className = 'status-dot offline';
                renderTasks();
            }
        }

        async function addTaskToCloud(title, description) {
            if (!isConfigured) {
                const newTask = {
                    id: Date.now(),
                    title: title,
                    description: description || 'Без описания',
                    author: currentUser,
                    taken: false,
                    created_at: new Date().toISOString()
                };
                tasks.unshift(newTask);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                renderTasks();
                showToast('✅ Задание сохранено локально');
                return true;
            }

            try {
                const { data, error } = await supabase
                    .from(tableName)
                    .insert([{
                        title: title,
                        description: description || 'Без описания',
                        author: currentUser,
                        taken: false
                    }])
                    .select();

                if (error) {
                    console.error('Ошибка добавления:', error);
                    if (error.code === '42501') {
                        showToast('❌ Нет прав на добавление!', true);
                    } else {
                        showToast('❌ Ошибка: ' + error.message, true);
                    }
                    isConfigured = false;
                    document.getElementById('statusDot').className = 'status-dot offline';
                    return addTaskToCloud(title, description);
                }
                
                if (data && data.length > 0) {
                    tasks.unshift(data[0]);
                    renderTasks();
                    showToast('✅ Задание добавлено в облако!');
                    return true;
                }
                return false;
            } catch (e) {
                console.error('Ошибка:', e);
                showToast('⚠️ Ошибка, сохраняем локально', true);
                isConfigured = false;
                document.getElementById('statusDot').className = 'status-dot offline';
                return addTaskToCloud(title, description);
            }
        }

        async function updateTaskInCloud(taskId, updates) {
            if (!isConfigured) {
                const task = tasks.find(t => String(t.id) === String(taskId));
                if (task) {
                    Object.assign(task, updates);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                    renderTasks();
                }
                return;
            }

            try {
                const { error } = await supabase
                    .from(tableName)
                    .update(updates)
                    .eq('id', taskId);

                if (error) throw error;
                
                const task = tasks.find(t => String(t.id) === String(taskId));
                if (task) {
                    Object.assign(task, updates);
                    renderTasks();
                    showToast('✅ Задание обновлено');
                }
            } catch (e) {
                console.error('Ошибка обновления:', e);
                showToast('❌ Ошибка обновления', true);
            }
        }

        async function deleteTaskFromCloud(taskId) {
            if (!isConfigured) {
                tasks = tasks.filter(t => String(t.id) !== String(taskId));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                renderTasks();
                showToast('🗑️ Задание удалено');
                return;
            }

            try {
                const { error } = await supabase
                    .from(tableName)
                    .delete()
                    .eq('id', taskId);

                if (error) throw error;
                
                tasks = tasks.filter(t => String(t.id) !== String(taskId));
                renderTasks();
                showToast('🗑️ Задание удалено');
            } catch (e) {
                console.error('Ошибка удаления:', e);
                showToast('❌ Ошибка удаления', true);
            }
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;

            document.getElementById('taskCount').textContent = tasks.length;

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        Нет заданий<br>
                        <span style="font-size:0.85rem; opacity:0.7;">Создайте первое!</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = tasks.map(task => {
                const statusLabel = task.taken ? 
                    '<span class="task-status taken"><i class="fas fa-user-check"></i> В работе</span>' : 
                    '<span class="task-status"><i class="fas fa-clock"></i> Свободно</span>';

                const isAuthor = task.author === currentUser;

                return `
                    <div class="task-card" data-id="${task.id}">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-desc">${escapeHtml(task.description || 'Без описания')}</div>
                        <div class="task-meta">
                            <span class="task-author"><i class="fas fa-user-graduate"></i> ${escapeHtml(task.author || 'Аноним')}</span>
                            ${statusLabel}
                        </div>
                        <div class="task-actions">
                            ${!task.taken ? `<button class="btn-action take" data-id="${task.id}"><i class="fas fa-hand-holding-heart"></i> Взять</button>` : ''}
                            ${isAuthor ? `<button class="btn-action done" data-id="${task.id}"><i class="fas fa-check"></i> Выполнено</button>` : ''}
                            ${isAuthor ? `<button class="btn-action delete" data-id="${task.id}"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.task-actions .take').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    if (confirm('Взять это задание?')) {
                        updateTaskInCloud(id, { taken: true });
                        if (navigator.vibrate) navigator.vibrate(20);
                    }
                });
            });

            document.querySelectorAll('.task-actions .done').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    if (confirm('Отметить как выполненное?')) {
                        deleteTaskFromCloud(id);
                        if (navigator.vibrate) navigator.vibrate(10);
                    }
                });
            });

            document.querySelectorAll('.task-actions .delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    if (confirm('Удалить задание?')) {
                        deleteTaskFromCloud(id);
                        if (navigator.vibrate) navigator.vibrate(10);
                    }
                });
            });
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function addTask() {
            const titleInput = document.getElementById('taskTitleInput');
            const descInput = document.getElementById('taskDescInput');

            const title = titleInput.value.trim();
            const description = descInput.value.trim() || 'Без описания';

            if (!title) {
                showToast('⚠️ Напишите название задания', true);
                return;
            }

            const btn = document.getElementById('addTaskBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Добавление...';

            const success = await addTaskToCloud(title, description);

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-plus"></i> Добавить';
            
            if (success) {
                titleInput.value = '';
                descInput.value = '';
                titleInput.blur();
                descInput.blur();
                if (navigator.vibrate) navigator.vibrate(15);
                document.getElementById('tasksContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
    })();
</script>
</body>
</html>
