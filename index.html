<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost — Анонимные задания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        :root {
            --bg-primary: #0b0e14; --bg-secondary: #141b24; --bg-card: #181f2b;
            --border: #29323e; --text: #e8edf5; --muted: #7b8aa3; --accent: #3a6090;
        }
        body { background: var(--bg-primary); color: var(--text); display: flex; justify-content: center; padding: 20px 16px; }
        .app { max-width: 500px; width: 100%; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
        h1 { font-size: 1.6rem; font-weight: 500; background: linear-gradient(135deg, #d6e2f5, #8aa1c9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { background: rgba(74, 175, 122, 0.15); border: 1px solid #4aaf7a; border-radius: 40px; padding: 4px 12px; font-size: 0.65rem; color: #4aaf7a; font-weight: bold; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        label { display: block; font-size: 0.75rem; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { width: 100%; background: #0b1119; border: 1px solid var(--border); padding: 12px; color: #fff; border-radius: 12px; outline: none; font-size: 0.95rem; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--accent); }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 50px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #4a7aaa; transform: translateY(-1px); }
        button:disabled { background: #1e2632; color: var(--muted); cursor: not-allowed; transform: none; }
        .status { text-align: center; font-size: 0.9rem; margin-top: 15px; display: none; padding: 12px; border-radius: 12px; }
        .ok { display: block; background: rgba(74, 175, 122, 0.1); color: #4aaf7a; border: 1px solid rgba(74, 175, 122, 0.2); }
        .err { display: block; background: rgba(201, 74, 74, 0.1); color: #c94a4a; border: 1px solid rgba(201, 74, 74, 0.2); }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>GHOST</h1>
        <div class="badge">● ONLINE</div>
    </div>
    
    <div class="card">
        <form id="ghostForm">
            <label>Кодовое название</label>
            <input type="text" id="title" placeholder="Передача пакета" required>
            
            <label>Описание контракта</label>
            <textarea id="desc" rows="3" placeholder="Суть, локация, условия..." required></textarea>
            
            <label>Гонорар</label>
            <input type="text" id="reward" placeholder="5000 руб / XMR" required>

            <label>Ваш контакт (Анонимно)</label>
            <input type="text" id="contact" placeholder="Telegram, Session ID..." required>
            
            <button type="submit">Опубликовать</button>
        </form>
        <div id="status" class="status"></div>
    </div>
</div>

<script>
    const FORM_URL = "https://google.com";
    const FIELDS = ["entry.1746401037", "entry.1508215891", "entry.724816159", "entry.271922579"];

    document.getElementById('ghostForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const box = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "ОТПРАВКА...";
        box.style.display = "none";

        const data = new URLSearchParams();
        ["title", "desc", "reward", "contact"].forEach((id, i) => {
            data.append(FIELDS[i], document.getElementById(id).value);
        });

        fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: data })
        .then(() => {
            box.className = "status ok";
            box.innerText = "Контракт опубликован в сети Ghost.";
            e.target.reset();
        })
        .catch(() => {
            box.className = "status err";
            box.innerText = "Ошибка сети. Повторите попытку.";
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Опубликовать";
        });
    });
</script>

</body>
</html>
