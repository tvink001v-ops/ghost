<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Доска заданий</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            color: #e6edf3;
        }
        .app-wrapper {
            max-width: 900px;
            width: 100%;
            background: #161b22;
            border-radius: 40px 40px 30px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 24px 22px 36px;
            border: 1px solid #30363d;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 12px 10px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            background: #238636;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 12px rgba(35, 134, 54, 0.3);
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: #f0f6fc;
        }
        .logo-text span { color: #238636; }

        /* Секция создания */
        .create-section {
            background: #0d1117;
            border-radius: 30px;
            padding: 20px 22px 26px;
            margin-bottom: 30px;
            border: 1px solid #30363d;
        }
        .create-title {
            font-weight: 600;
            font-size: 1.25rem;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .create-title i { color: #238636; }
        .create-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .create-input-group {
            flex: 3 1 220px;
            min-width: 180px;
        }
        .create-input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #8b949e;
            margin-bottom: 5px;
        }
        .create-input-group input,
        .create-input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
        }
        .create-input-group textarea {
            border-radius: 20px;
            resize: vertical;
            min-height: 50px;
            font-family: inherit;
        }
        .create-input-group input:focus,
        .create-input-group textarea:focus {
            border-color: #238636;
            box-shadow: 0 0 0 4px rgba(35, 134, 54, 0.15);
        }
        .create-input-group input::placeholder,
        .create-input-group textarea::placeholder {
            color: #8b949e;
        }
        .create-btn {
            background: #238636;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(35, 134, 54, 0.3);
            flex: 0 1 auto;
            height: 50px;
            white-space: nowrap;
        }
        .create-btn:hover {
            background: #2ea043;
            transform: scale(0.97);
        }
        .remote-badge {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #8b949e;
            background: #0d1117;
            padding: 4px 16px;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid #30363d;
        }
        .remote-badge i { margin-right: 6px; color: #238636; }

        /* Список */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 12px 0 16px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .list-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f0f6fc;
        }
        .list-header h2 i { color: #238636; margin-right: 10px; }
        .list-header span {
            background: #0d1117;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #8b949e;
            border: 1px solid #30363d;
        }
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .task-card {
            background: #0d1117;
            border-radius: 26px;
            padding: 18px 18px 20px;
            border: 1px solid #30363d;
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .task-card:hover {
            border-color: #238636;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .task-title {
            font-weight: 600;
            font-size: 1.15rem;
            color: #f0f6fc;
            margin-bottom: 4px;
        }
        .task-desc {
            font-size: 0.95rem;
            color: #8b949e;
            margin-bottom: 12px;
            line-height: 1.4;
            flex: 1;
            word-break: break-word;
        }
        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            border-top: 1px solid #30363d;
            padding-top: 14px;
        }
        .task-author {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .task-author i { font-size: 1rem; color: #238636; }
        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn-action {
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #21262d;
            color: #c9d1d9;
        }
        .btn-action:hover { background: #30363d; }
        .btn-action.take {
            background: #238636;
            color: white;
        }
        .btn-action.take:hover { background: #2ea043; }
        .btn-action.done {
            background: #1f6feb;
            color: white;
        }
        .btn-action.done:hover { background: #388bfd; }
        .btn-action.delete {
            background: #da3633;
            color: white;
        }
        .btn-action.delete:hover { background: #f85149; }
        .task-status {
            font-size: 0.7rem;
            background: #238636;
            color: #f0f6fc;
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 600;
        }
        .task-status.taken {
            background: #d29922;
            color: #f0f6fc;
        }

        .footer-note {
            margin-top: 32px;
            font-size: 0.85rem;
            color: #8b949e;
            text-align: center;
            border-top: 1px solid #30363d;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer-note i { margin-right: 4px; color: #238636; }

        /* Пустое состояние */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 40px 20px;
            background: #0d1117;
            border-radius: 40px;
            color: #8b949e;
            border: 1px dashed #30363d;
        }
        .empty-state i {
            font-size: 2.2rem;
            opacity: 0.5;
            margin-bottom: 12px;
            display: block;
            color: #238636;
        }

        @media (max-width: 620px) {
            .app-wrapper { padding: 16px; }
            .create-section { padding: 18px; }
            .create-btn { width: 100%; justify-content: center; }
            .logo-text { font-size: 1.2rem; }
        }
        @media (max-width: 460px) {
            .header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- Шапка -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tasks"></i></div>
            <div class="logo-text">Доска <span>заданий</span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; background: #0d1117; padding: 6px 16px 6px 12px; border-radius: 40px; border: 1px solid #30363d;">
            <i class="fas fa-user" style="color: #238636;"></i>
            <span style="font-size: 0.9rem; color: #e6edf3;">Вы</span>
        </div>
    </div>

    <!-- Создание задания -->
    <div class="create-section">
        <div class="create-title">
            <i class="fas fa-plus-circle"></i> Создать задание
        </div>
        <div class="create-grid">
            <div class="create-input-group" style="flex: 2 1 200px;">
                <label for="taskTitleInput"><i class="far fa-file-alt"></i> Название *</label>
                <input type="text" id="taskTitleInput" placeholder="Например: Помогите с физикой">
            </div>
            <div class="create-input-group" style="flex: 3 1 260px;">
                <label for="taskDescInput"><i class="fas fa-align-left"></i> Описание</label>
                <textarea id="taskDescInput" rows="1" placeholder="Что нужно сделать..."></textarea>
            </div>
            <button class="create-btn" id="addTaskBtn"><i class="fas fa-plus"></i> Добавить</button>
        </div>
        <div class="remote-badge">
            <i class="fas fa-globe-americas"></i> Все задания выполняются удалённо
        </div>
    </div>

    <!-- Список -->
    <div class="list-header">
        <h2><i class="fas fa-list-ul"></i>Доступные задания</h2>
        <span><i class="fas fa-user-friends"></i> <span id="taskCount">0</span> заданий</span>
    </div>

    <div class="tasks-grid" id="tasksContainer">
        <!-- Карточки генерируются JS -->
    </div>

    <div class="footer-note">
        <span><i class="fas fa-check-circle"></i> Создавай любые задания</span>
        <span><i class="fas fa-handshake"></i> Помогай другим</span>
        <span><i class="fas fa-edit"></i> Отмечай выполненными</span>
    </div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'dark_board_tasks';

        let tasks = [];

        function loadTasks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        tasks = parsed;
                        return;
                    }
                } catch (e) {}
            }
            // Пустой список — никаких фейков!
            tasks = [];
            saveTasks();
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;

            // Обновляем счётчик
            document.getElementById('taskCount').textContent = tasks.length;

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        Пока нет заданий. Создайте первое!
                    </div>
                `;
                return;
            }

            container.innerHTML = tasks.map(task => {
                const statusLabel = task.taken ? 
                    '<span class="task-status taken"><i class="fas fa-user-check"></i> В работе</span>' : 
                    '<span class="task-status"><i class="fas fa-clock"></i> Свободно</span>';

                return `
                    <div class="task-card" data-id="${task.id}">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-desc">${escapeHtml(task.description || 'Без описания')}</div>
                        <div class="task-meta">
                            <span class="task-author"><i class="fas fa-user-graduate"></i> ${escapeHtml(task.author || 'Вы')}</span>
                            ${statusLabel}
                        </div>
                        <div class="task-actions">
                            ${!task.taken ? `<button class="btn-action take" data-id="${task.id}"><i class="fas fa-hand-holding-heart"></i> Взять</button>` : ''}
                            <button class="btn-action done" data-id="${task.id}"><i class="fas fa-check"></i> Выполнено</button>
                            <button class="btn-action delete" data-id="${task.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            // Обработчики
            document.querySelectorAll('.task-actions .take').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.getAttribute('data-id'), 10);
                    const task = tasks.find(t => t.id === id);
                    if (task && !task.taken) {
                        task.taken = true;
                        saveTasks();
                        renderTasks();
                        alert(`✅ Вы взяли задание: "${task.title}"\nСвяжитесь с автором в чате.`);
                    }
                });
            });

            document.querySelectorAll('.task-actions .done').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.getAttribute('data-id'), 10);
                    const task = tasks.find(t => t.id === id);
                    if (task) {
                        if (confirm(`Отметить "${task.title}" как выполненное?`)) {
                            tasks = tasks.filter(t => t.id !== id);
                            saveTasks();
                            renderTasks();
                        }
                    }
                });
            });

            document.querySelectorAll('.task-actions .delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.getAttribute('data-id'), 10);
                    const task = tasks.find(t => t.id === id);
                    if (task) {
                        if (confirm(`Удалить задание "${task.title}"?`)) {
                            tasks = tasks.filter(t => t.id !== id);
                            saveTasks();
                            renderTasks();
                        }
                    }
                });
            });
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function addTask() {
            const titleInput = document.getElementById('taskTitleInput');
            const descInput = document.getElementById('taskDescInput');

            const title = titleInput.value.trim();
            const description = descInput.value.trim() || 'Без описания';

            if (!title) {
                alert('Пожалуйста, напишите название задания');
                return;
            }

            const maxId = tasks.reduce((max, t) => (t.id > max ? t.id : max), 0);
            const newTask = {
                id: maxId + 1,
                title: title,
                author: 'Вы',
                description: description,
                taken: false
            };

            tasks.push(newTask);
            saveTasks();

            titleInput.value = '';
            descInput.value = '';

            renderTasks();
            document.getElementById('tasksContainer').scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function init() {
            loadTasks();
            renderTasks();

            const addBtn = document.getElementById('addTaskBtn');
            if (addBtn) addBtn.addEventListener('click', addTask);

            const titleInput = document.getElementById('taskTitleInput');
            if (titleInput) {
                titleInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addTask();
                    }
                });
            }
        }

        init();
    })();
</script>
</body>
</html>
