<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Призрак • Секретная Сеть</title>
    <style>
        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0b0e; color: #7a889b; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .terminal { max-width: 500px; width: 100%; background: #111116; border: 1px solid #222230; padding: 25px; border-radius: 8px; box-shadow: 0 0 20px rgba(255, 62, 62, 0.1); }
        h1 { color: #ff3e3e; text-align: center; font-size: 24px; letter-spacing: 4px; margin-bottom: 5px; text-shadow: 0 0 8px rgba(255, 62, 62, 0.3); }
        .subtitle { text-align: center; font-size: 11px; color: #475366; margin-bottom: 30px; text-transform: uppercase; }
        label { display: block; font-size: 12px; color: #a3b3cc; margin-bottom: 5px; text-transform: uppercase; }
        input, textarea { width: 100%; background: #161622; border: 1px solid #2d2d3f; padding: 12px; color: #fff; border-radius: 4px; margin-bottom: 20px; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #ff3e3e; box-shadow: 0 0 5px rgba(255, 62, 62, 0.2); }
        button { width: 100%; background: #ff3e3e; color: #fff; border: none; padding: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        button:hover { background: #e03232; transform: translateY(-1px); }
        button:disabled { background: #322323; color: #666; cursor: not-allowed; }
        .status { text-align: center; font-size: 13px; margin-top: 15px; display: none; padding: 10px; border-radius: 4px; }
        .success { display: block; background: rgba(0, 200, 100, 0.1); color: #00c864; border: 1px solid rgba(0, 200, 100, 0.2); }
        .error { display: block; background: rgba(255, 62, 62, 0.1); color: #ff3e3e; border: 1px solid rgba(255, 62, 62, 0.2); }
    </style>
</head>
<body>

<div class="terminal">
    <h1>PHANTOM</h1>
    <div class="subtitle">Анонимная отправка секретных поручений</div>
    
    <form id="taskForm">
        <label>Кодовое название услуги</label>
        <input type="text" id="title" placeholder="Например: Передача X-пакета" required>
        
        <label>Шифрованное описание контракта</label>
        <textarea id="description" rows="4" placeholder="Укажите суть задания, локацию или скрытые условия..." required></textarea>
        
        <label>Гонорар / Награда</label>
        <input type="text" id="reward" placeholder="Например: 5000 руб / Наличные" required>

        <label>Ваш contact для связи (Анонимно)</label>
        <input type="text" id="contact" placeholder="Telegram, Session ID, Email..." required>
        
        <button type="submit">Опубликовать контракт</button>
    </form>
    
    <div id="statusBox" class="status"></div>
</div>

<script>
    // Ссылка на обработчик ответов вашей конкретной Google Формы
    const GOOGLE_FORM_URL = "https://google.com"; 
    
    // Технические ID ваших полей
    const ENTRY_TITLE = "entry.1746401037";       
    const ENTRY_DESCRIPTION = "entry.1508215891"; 
    const ENTRY_REWARD = "entry.724816159";      
    const ENTRY_CONTACT = "entry.271922579";     

    document.getElementById('taskForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = e.target.querySelector('button');
        const statusBox = document.getElementById('statusBox');
        
        btn.disabled = true;
        btn.innerText = "ШИФРОВАНИЕ И ОТПРАВКА...";
        statusBox.style.display = "none";
        
        // Упаковка данных в формат Google
        const formData = new URLSearchParams();
        formData.append(ENTRY_TITLE, document.getElementById('title').value);
        formData.append(ENTRY_DESCRIPTION, document.getElementById('description').value);
        formData.append(ENTRY_REWARD, document.getElementById('reward').value);
        formData.append(ENTRY_CONTACT, document.getElementById('contact').value);
        
        // Отправка в облако Google (сервером выступает дата-центр Google, не ваш ПК)
        fetch(GOOGLE_FORM_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        })
        .then(() => {
            statusBox.className = "status success";
            statusBox.innerText = "Контракт успешно ушел в зашифрованную сеть.";
            document.getElementById('taskForm').reset();
        })
        .catch(() => {
            statusBox.className = "status error";
            statusBox.innerText = "Ошибка соединения. Попробуйте повторить.";
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Опубликовать контракт";
        });
    });
</script>

</body>
</html>
