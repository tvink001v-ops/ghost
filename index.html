<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost — Анонимные задания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        :root {
            --bg-primary: #0b0e14; --bg-secondary: #141b24; --bg-card: #181f2b;
            --border: #29323e; --text: #e8edf5; --muted: #7b8aa3; --accent: #3a6090; --success: #4aaf7a;
        }
        body { background: var(--bg-primary); color: var(--text); display: flex; justify-content: center; padding: 20px 16px; }
        .app { max-width: 500px; width: 100%; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; }
        h1 { font-size: 1.6rem; font-weight: 500; background: linear-gradient(135deg, #d6e2f5, #8aa1c9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--muted); border-radius: 40px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s; border-style: solid; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .feed { display: flex; flex-direction: column; gap: 12px; }
        .task-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; position: relative; }
        .task-card h3 { font-size: 1.1rem; font-weight: 500; margin-bottom: 6px; color: #fff; }
        .task-card p { color: var(--muted); font-size: 0.9rem; line-height: 1.4; margin-bottom: 10px; white-space: pre-wrap; }
        .task-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
        .reward-badge { color: var(--success); font-weight: 600; }
        .time-stamp { color: #536279; }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
        label { display: block; font-size: 0.75rem; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; }
        input, textarea { width: 100%; background: #0b1119; border: 1px solid var(--border); padding: 12px; color: #fff; border-radius: 12px; outline: none; font-size: 0.95rem; }
        input:focus, textarea:focus { border-color: var(--accent); }
        
        button.submit-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 50px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 20px; }
        .status { text-align: center; font-size: 0.9rem; margin-top: 15px; display: none; padding: 12px; border-radius: 12px; }
        .ok { display: block; background: rgba(74, 175, 122, 0.1); color: var(--success); border: 1px solid rgba(74, 175, 122, 0.2); }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>GHOST</h1>
        <div style="color: var(--success); font-size: 0.8rem; font-weight: bold;">● ONLINE</div>
    </div>
    
    <div class="tabs">
        <button id="btn-feed" class="tab-btn active" onclick="switchTab('feed-page')">Контракты</button>
        <button id="btn-create" class="tab-btn" onclick="switchTab('create-page')">Создать контракт</button>
    </div>

    <!-- Вкладка 1: Список контрактов -->
    <div id="feed-page" class="page active">
        <div id="taskList" class="feed">Загрузка актуальных контрактов...</div>
    </div>

    <!-- Вкладка 2: Форма создания -->
    <div id="create-page" class="page">
        <div class="card">
            <form id="ghostForm">
                <label>Кодовое название услуги</label>
                <input type="text" id="title" placeholder="Передача пакета" required>
                
                <label>Описание контракта</label>
                <textarea id="desc" rows="4" placeholder="Суть, локация, условия..." required></textarea>
                
                <label>Гонорар</label>
                <input type="text" id="reward" placeholder="5000 руб / XMR" required>

                <button type="submit" class="submit-btn">Опубликовать в сети</button>
            </form>
            <div id="status" class="status"></div>
        </div>
    </div>
</div>

<script>
    var FORM_URL = "https://google.com";
    var FIELDS = ["entry.1746401037", "entry.1508215891", "entry.724816159"];

    function switchTab(pageId) {
        document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        
        document.getElementById(pageId).classList.add('active');
        if (pageId === 'feed-page') {
            document.getElementById('btn-feed').classList.add('active');
            loadTasks();
        } else {
            document.getElementById('btn-create').classList.add('active');
        }
    }

    function parseCSV(text) {
        let lines = []; let row = [""]; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i]; let next = text[i+1];
            if (c === '"') {
                if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) { row.push(''); }
            else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && next === '\n') { i++; }
                lines.push(row); row = [''];
            } else { row[row.length - 1] += c; }
        }
        if (row.length > 1 || row !== '') lines.push(row);
        return lines;
    }

    function loadTasks() {
        var list = document.getElementById('taskList');
        
        // Оригинальная ссылка на ваш CSV-файл Google
        var csvUrl = "https://google.com";
        
        // Публичный CORS-прокси. Ссылка собирается максимально надежным методом.
        var finalApiUrl = "https://allorigins.win" + encodeURIComponent(csvUrl) + "&_nocache=" + Date.now();

        fetch(finalApiUrl)
        .then(function(res) {
            if (!res.ok) throw new Error("Network error");
            return res.json();
        })
        .then(function(jsonData) {
            // Разбираем CSV-строки из ответа прокси-сервера
            var rows = parseCSV(jsonData.contents);
            if (!rows || rows.length <= 1) {
                list.innerHTML = "<p style='text-align:center; color:var(--muted);'>Нет активных контрактов.</p>";
                return;
            }

            list.innerHTML = "";

            // Сортировка от новых к старым
            for (var i = rows.length - 1; i >= 1; i--) {
                var cells = rows[i];
                if (!cells || cells.length < 4) continue;

                var time = cells[0] || "Недавно";
                var title = cells[1] || "Без названия";
                var desc = cells[2] || "Описание отсутствует";
                var reward = cells[3] || "Не указана";

                list.innerHTML += '<div class="task-card">' +
                    '<h3>' + escapeHtml(title) + '</h3>' +
                    '<p>' + escapeHtml(desc) + '</p>' +
                    '<div class="task-meta">' +
                        '<span class="reward-badge">💰 Награда: ' + escapeHtml(reward) + '</span>' +
                        '<span class="time-stamp">' + escapeHtml(time) + '</span>' +
                    '</div>' +
                '</div>';
            }
        })
        .catch(function(err) {
            console.error(err);
            list.innerHTML = "<p style='text-align:center; color:var(--muted);'>Ошибка доступа к базе данных контрактов. Пожалуйста, сбросьте кэш страницы (Ctrl+F5) через 1 минуту.</p>";
        });
    }

    document.getElementById('ghostForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = e.target.querySelector('button');
        var box = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "ШИФРОВАНИЕ...";

        var data = new URLSearchParams();
        FIELDS.forEach(function(fieldId, i) {
            var inputId = ["title", "desc", "reward"][i];
            data.append(fieldId, document.getElementById(inputId).value);
        });

        fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: data })
        .then(function() {
            box.className = "status ok";
            box.innerText = "Контракт опубликован.";
            box.style.display = "block";
            e.target.reset();
            setTimeout(function() { switchTab('feed-page'); box.style.display = "none"; }, 1500);
        })
        .catch(function() {
            alert("Ошибка при отправке поручения. Проверьте сеть.");
        })
        .finally(function() {
            btn.disabled = false;
            btn.innerText = "Опубликовать в сети";
        });
    });

    function escapeHtml(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadTasks();
</script>

</body>
</html>
